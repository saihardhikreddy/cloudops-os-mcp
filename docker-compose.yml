version: "3.9"

services:
  cloudops-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: cloudops-mcp
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Override with a .env file or environment-specific values
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./policies:/app/policies:ro   # Mount policies as read-only
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional: local Redis for production message broker
  # redis:
  #   image: redis:7-alpine
  #   container_name: cloudops-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

networks:
  default:
    name: cloudops-network
